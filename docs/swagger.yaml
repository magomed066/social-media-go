basePath: /v1
definitions:
  FollowerUserPayload:
    properties:
      user_id:
        type: integer
    type: object
  LoginUserPayload:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  RegisterUserPayload:
    properties:
      email:
        type: string
      first_name:
        maxLength: 100
        type: string
      last_name:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 3
        type: string
      username:
        maxLength: 50
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - username
    type: object
  Response:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
  User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      isActive:
        type: boolean
      lastName:
        type: string
      role:
        $ref: '#/definitions/roles.Role'
      roleID:
        type: integer
      username:
        type: string
    type: object
  UserWithAuthToken:
    properties:
      accessToken:
        type: string
      user:
        $ref: '#/definitions/User'
    type: object
  roles.Role:
    properties:
      ID:
        type: integer
      description:
        type: string
      level:
        type: integer
      name:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for social network.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Social Media API
  version: "1.0"
paths:
  /auth/activate/{token}:
    put:
      description: Activates a user using an unexpired invitation token.
      parameters:
      - description: Invitation token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Invalid or expired invitation token
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Response'
      summary: Activate a user
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an activated account and returns the user and a JWT
        access token. Use Bearer <accessToken> in the Authorization header for protected
        endpoints.
      parameters:
      - description: Login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/LoginUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/UserWithAuthToken'
              type: object
        "400":
          description: Invalid request body or missing credentials
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/Response'
        "403":
          description: Account is not activated
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Response'
      summary: Log in
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an inactive user and an invitation for account activation.
      parameters:
      - description: User registration details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/RegisterUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/User'
              type: object
        "400":
          description: Invalid registration details or duplicate email or username
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Response'
      summary: Register a user
      tags:
      - Auth
  /users/{userID}/:
    get:
      consumes:
      - application/json
      description: Fetches a user by id
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Fetch a user
      tags:
      - Users
  /users/{userID}/follow:
    put:
      consumes:
      - application/json
      description: Adds the user identified by user_id in the request body as a follower
        of the user in the path.
      parameters:
      - description: User ID to follow
        in: path
        name: userID
        required: true
        type: integer
      - description: Follower's user ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/FollowerUserPayload'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Follow a user
      tags:
      - Users
  /users/{userID}/unfollow:
    put:
      consumes:
      - application/json
      description: Removes the user identified by user_id in the request body as a
        follower of the user in the path.
      parameters:
      - description: User ID to unfollow
        in: path
        name: userID
        required: true
        type: integer
      - description: Follower's user ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/FollowerUserPayload'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Unfollow a user
      tags:
      - Users
  /users/delete/{userID}:
    delete:
      description: Deletes a user by ID.
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Delete a user
      tags:
      - Users
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
