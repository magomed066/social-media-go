basePath: /v1
definitions:
  json.envelope:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
  users.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      username:
        type: string
    type: object
  usersDTO.FollowerUserPayload:
    properties:
      user_id:
        type: integer
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for social network.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Social Media API
  version: "1.0"
paths:
  /users/{userID}/:
    get:
      consumes:
      - application/json
      description: Fetches a user by id
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/json.envelope'
            - properties:
                data:
                  $ref: '#/definitions/users.User'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/json.envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/json.envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/json.envelope'
      security:
      - ApiKeyAuth: []
      summary: Fetch a user
      tags:
      - Users
  /users/{userID}/follow:
    put:
      consumes:
      - application/json
      description: Adds the user identified by user_id in the request body as a follower
        of the user in the path.
      parameters:
      - description: User ID to follow
        in: path
        name: userID
        required: true
        type: integer
      - description: Follower's user ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/usersDTO.FollowerUserPayload'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/json.envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/json.envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/json.envelope'
      security:
      - ApiKeyAuth: []
      summary: Follow a user
      tags:
      - Users
  /users/{userID}/unfollow:
    put:
      consumes:
      - application/json
      description: Removes the user identified by user_id in the request body as a
        follower of the user in the path.
      parameters:
      - description: User ID to unfollow
        in: path
        name: userID
        required: true
        type: integer
      - description: Follower's user ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/usersDTO.FollowerUserPayload'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/json.envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/json.envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/json.envelope'
      security:
      - ApiKeyAuth: []
      summary: Unfollow a user
      tags:
      - Users
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
