basePath: /v1
definitions:
  FollowerUserPayload:
    properties:
      user_id:
        description: ID of the follower, supplied explicitly rather than taken from
          the access token.
        example: 2
        type: integer
    type: object
  LoginUserPayload:
    properties:
      email:
        example: jane@example.com
        type: string
      password:
        example: example-password
        type: string
    required:
    - email
    - password
    type: object
  RegisterUserPayload:
    properties:
      email:
        example: jane@example.com
        format: email
        type: string
      first_name:
        example: Jane
        maxLength: 100
        type: string
      last_name:
        example: Doe
        maxLength: 255
        type: string
      password:
        example: example-password
        maxLength: 72
        minLength: 3
        type: string
      username:
        example: jane_doe
        maxLength: 50
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - username
    type: object
  Response:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
  User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      isActive:
        type: boolean
      lastName:
        type: string
      role:
        $ref: '#/definitions/roles.Role'
      roleID:
        type: integer
      username:
        type: string
    type: object
  UserWithAuthToken:
    properties:
      accessToken:
        type: string
      user:
        $ref: '#/definitions/User'
    type: object
  comments.Comment:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      post_id:
        type: integer
      user:
        $ref: '#/definitions/users.Author'
      user_id:
        type: integer
    type: object
  commentsDTO.CreateCommentPayload:
    properties:
      content:
        example: Thanks for sharing this post!
        maxLength: 300
        type: string
    required:
    - content
    type: object
  posts.Post:
    properties:
      comments:
        items:
          $ref: '#/definitions/comments.Comment'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/users.Author'
      user_id:
        type: integer
      version:
        type: integer
    type: object
  posts.PostWithMetaData:
    properties:
      comments:
        items:
          $ref: '#/definitions/comments.Comment'
        type: array
      comments_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/users.Author'
      user_id:
        type: integer
      version:
        type: integer
    type: object
  postsDTO.CreatePostPayload:
    properties:
      content:
        example: Sharing what I learned today.
        maxLength: 1000
        type: string
      tags:
        example:
        - go
        - learning
        items:
          type: string
        type: array
      title:
        example: My first post
        maxLength: 200
        type: string
    required:
    - content
    - title
    type: object
  postsDTO.UpdatePostPayload:
    properties:
      content:
        example: Updated post content.
        maxLength: 1000
        type: string
      title:
        example: Updated title
        maxLength: 200
        type: string
    type: object
  roles.Role:
    properties:
      ID:
        type: integer
      description:
        type: string
      level:
        type: integer
      name:
        type: string
    type: object
  users.Author:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for social network.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Social Media API
  version: "1.0"
paths:
  /auth/activate/{token}:
    put:
      description: Activates a user using the unexpired invitation token from the
        welcome email. The token is consumed on success and cannot be reused.
      parameters:
      - description: Invitation token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Invalid or expired invitation token
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      summary: Activate a user
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates an activated account and returns the user and a JWT
        access token. Use Bearer <accessToken> in the Authorization header for protected
        endpoints.
      parameters:
      - description: Login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/LoginUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/UserWithAuthToken'
              type: object
        "400":
          description: Invalid request body or missing credentials
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/Response'
        "403":
          description: Account is not activated
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      summary: Log in
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an inactive user and emails an activation link. Activate
        the account before logging in. The response contains the user profile without
        a password or invitation token.
      parameters:
      - description: User registration details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/RegisterUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/User'
              type: object
        "400":
          description: Invalid registration details or duplicate email or username
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      summary: Register a user
      tags:
      - Auth
  /posts/:
    post:
      consumes:
      - application/json
      description: Creates a post with a title, content, and optional tags. The current
        implementation assigns user ID 3 as the author instead of the authenticated
        user.
      parameters:
      - description: Post details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/postsDTO.CreatePostPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Invalid request body or post details
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Create a post
      tags:
      - Posts
  /posts/{postID}/:
    delete:
      description: Deletes a post by ID. Requires ownership of the post or a role
        with at least administrator privileges.
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid post ID
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "403":
          description: Insufficient permissions to modify this post
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Delete a post
      tags:
      - Posts
    get:
      description: Returns a post by ID, including its comments.
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Invalid post ID
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Fetch a post
      tags:
      - Posts
    patch:
      consumes:
      - application/json
      description: Updates the supplied title and content fields. Omitted or null
        fields remain unchanged. Requires ownership of the post or a role with at
        least moderator privileges.
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      - description: Post details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/postsDTO.UpdatePostPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/posts.Post'
              type: object
        "400":
          description: Invalid post ID or request body
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "403":
          description: Insufficient permissions to modify this post
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Update a post
      tags:
      - Posts
  /posts/{postID}/comments:
    get:
      description: Returns the comments for the specified post, including author details.
      parameters:
      - description: Post ID
        in: path
        minimum: 1
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/comments.Comment'
                  type: array
              type: object
        "400":
          description: Post ID must be a positive integer
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: List comments for a post
      tags:
      - Comments
    post:
      consumes:
      - application/json
      description: Creates a comment on the specified post. The current implementation
        assigns user ID 55 as the author instead of the authenticated user.
      parameters:
      - description: Post ID
        in: path
        minimum: 1
        name: postID
        required: true
        type: integer
      - description: Comment details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/commentsDTO.CreateCommentPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/comments.Comment'
              type: object
        "400":
          description: Invalid post ID, request body, or comment content
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Create a comment
      tags:
      - Comments
  /users/{userID}/:
    get:
      description: Returns the user profile and role for the given positive user ID.
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  $ref: '#/definitions/User'
              type: object
        "400":
          description: User ID must be a positive integer
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Fetch a user
      tags:
      - Users
  /users/{userID}/follow:
    put:
      consumes:
      - application/json
      description: Adds the user identified by user_id in the request body as a follower
        of the user in the path. The follower ID is supplied explicitly and is not
        inferred from the access token.
      parameters:
      - description: User ID to follow
        in: path
        name: userID
        required: true
        type: integer
      - description: Follower's user ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/FollowerUserPayload'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid user ID or malformed request body
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Follow a user
      tags:
      - Users
  /users/{userID}/unfollow:
    put:
      consumes:
      - application/json
      description: Removes the user identified by user_id in the request body as a
        follower of the user in the path. The follower ID is supplied explicitly and
        is not inferred from the access token.
      parameters:
      - description: User ID to unfollow
        in: path
        name: userID
        required: true
        type: integer
      - description: Follower's user ID
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/FollowerUserPayload'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid user ID or malformed request body
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Unfollow a user
      tags:
      - Users
  /users/delete/{userID}:
    delete:
      description: Deletes a user and their invitations by ID. Returns no content
        even if the user does not exist.
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Delete a user
      tags:
      - Users
  /users/feed:
    get:
      description: Returns posts with author details and comment counts, filtered
        and ordered by creation time. The current implementation uses user ID 3 instead
        of the authenticated user's ID.
      parameters:
      - description: Number of posts to return
        in: query
        maximum: 20
        minimum: 1
        name: limit
        required: true
        type: integer
      - description: Number of posts to skip
        in: query
        minimum: 0
        name: offset
        required: true
        type: integer
      - default: desc
        description: Creation time sort order
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - collectionFormat: csv
        description: Up to 5 comma-separated tags; posts must contain all supplied
          tags
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: Case-insensitive text search in title or content (maximum 10
          characters)
        in: query
        maxLength: 10
        name: search
        type: string
      - description: Inclusive creation time, formatted as YYYY-MM-DD HH:MM:SS
        in: query
        name: from
        type: string
      - description: Exclusive creation time, formatted as YYYY-MM-DD HH:MM:SS; only
          parsed when from is supplied
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/posts.PostWithMetaData'
                  type: array
              type: object
        "400":
          description: Missing or invalid pagination or filter parameters
          schema:
            $ref: '#/definitions/Response'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/Response'
      security:
      - ApiKeyAuth: []
      summary: Get the user feed
      tags:
      - Users
securityDefinitions:
  ApiKeyAuth:
    description: Enter Bearer <accessToken>, using the accessToken returned by POST
      /auth/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
